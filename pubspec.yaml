name: pointbox_mobile
description: A PointBox mobile application with GetX state management
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  shared_preferences: ^2.2.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.2
  http: ^1.1.2
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  google_fonts: ^6.2.1
  path_provider: ^2.1.4
  share_plus: ^12.0.1
  fluttertoast: ^9.0.0
  pinput: ^4.0.0
  cloud_firestore: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

